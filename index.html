<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lucent</title>
    <script type="module" src="/src/main-tauri.ts" defer></script>
  </head>

  <body>
    <header id="toolbar">
      <div class="group">
        <button id="btn-open" class="primary" aria-label="Open" data-tip="Open file(s)"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><use href="#ic-folder"></use></svg></button>
        <button id="btn-paste-new" aria-label="Paste into new document" data-tip="Paste into new document (Cmd/Ctrl+Shift+V)"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><use href="#ic-clipboard-plus"></use></svg></button>
        <button id="btn-next" class="toolbar-compact-hide" aria-label="Next" data-tip="Next file in folder"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><use href="#ic-skip"></use></svg></button>
      </div>

      <span class="toolbar-sep" aria-hidden="true"></span>

      <div class="group">
        <button id="btn-edit" aria-label="Edit" data-tip="Edit"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><use href="#ic-pencil"></use></svg></button>
        <button id="btn-save" aria-label="Save" data-tip="Save (Cmd/Ctrl+S)" hidden><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><use href="#ic-save"></use></svg></button>
        <button id="btn-save-as" aria-label="Save As" data-tip="Save As (Cmd/Ctrl+Shift+S)"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><use href="#ic-save-as"></use></svg></button>
        <button id="btn-toggle" aria-label="Rendered" data-tip="Toggle rendered / raw" aria-pressed="false"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><use href="#ic-eye"></use></svg></button>
        <button id="btn-tail" class="toolbar-compact-hide" aria-label="Tail" data-tip="Tail / follow new lines" aria-pressed="false"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><use href="#ic-tail"></use></svg></button>
        <button id="btn-search" aria-label="Find" data-tip="Find (Cmd/Ctrl+F)"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><use href="#ic-search"></use></svg></button>
        <button id="btn-diagnostics" class="toolbar-compact-hide" aria-label="Diagnostics" data-tip="Diagnostics" aria-expanded="false"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><use href="#ic-info"></use></svg><span id="diagnostics-badge" class="toolbar-badge" hidden></span></button>
      </div>

      <span class="toolbar-sep" aria-hidden="true"></span>

      <div class="group toolbar-export" hidden>
        <select id="sel-viewas" title="View as" aria-label="View as">
          <option value="">View as…</option>
          <option value="markdown">Markdown</option>
          <option value="text">Plain text</option>
          <option value="data:json">JSON</option>
          <option value="data:yaml">YAML</option>
          <option value="data:toml">TOML</option>
          <option value="data:ini">INI</option>
        </select>
        <select id="download-format" class="download-format" title="Download as" aria-label="Download as">
          <option value="">Download as…</option>
        </select>
      </div>

      <div class="group">
        <div class="popover-host">
          <button id="btn-appearance" aria-label="Appearance" data-tip="Appearance" aria-haspopup="true" aria-expanded="false"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><use href="#ic-type"></use></svg></button>
          <div id="appearance-panel" class="popover" role="dialog" aria-label="Appearance" hidden>
            <label class="popover-row">Font
              <select id="sel-font" aria-label="Font family">
                <option value="sans">Sans</option>
                <option value="serif">Serif</option>
                <option value="mono">Mono</option>
              </select>
            </label>
            <label class="popover-row">Size
              <span id="size-value" class="size-value" aria-hidden="true">17px</span>
              <input id="inp-size" type="range" min="14" max="22" aria-label="Font size" />
            </label>
            <label class="popover-row">Theme
              <select id="sel-theme" aria-label="Theme">
                <option value="system">System</option>
                <option value="light">Light</option>
                <option value="sepia">Sepia</option>
                <option value="dark">Dark</option>
              </select>
            </label>
          </div>
        </div>
      </div>

      <div class="popover-host toolbar-overflow-host">
        <button id="btn-toolbar-overflow" class="toolbar-overflow-btn" aria-label="More actions" aria-haspopup="true" aria-expanded="false" data-tip="More actions"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><use href="#ic-more"></use></svg></button>
        <div id="toolbar-overflow-panel" class="popover toolbar-overflow-panel" role="menu" aria-label="More actions" hidden>
          <button type="button" role="menuitem" data-overflow="next">Next file in folder</button>
          <button type="button" role="menuitem" data-overflow="tail">Tail / follow new lines</button>
          <button type="button" role="menuitem" data-overflow="diagnostics">Diagnostics</button>
        </div>
      </div>

      <div class="spacer"></div>

      <span id="reading-time" class="reading-time" aria-live="polite" hidden></span>

      <div class="group toolbar-copy" hidden>
        <button id="btn-copy-md" aria-label="Copy as Markdown" data-tip="Copy as Markdown"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><use href="#ic-copy"></use></svg></button>
        <button id="btn-copy-rich" aria-label="Copy as rich text" data-tip="Copy as rich text"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><use href="#ic-richtext"></use></svg></button>
      </div>
    </header>

    <div id="tabstrip" hidden>
      <nav id="tabbar"></nav>
      <button id="btn-close-all" title="Close all tabs" aria-label="Close all tabs">✕</button>
    </div>

    <div id="searchbar" hidden role="search">
      <input id="search-input" type="text" placeholder="Find" aria-label="Find" />
      <button id="search-case" class="toggle" title="Match case" aria-pressed="false">Aa</button>
      <button id="search-regex" class="toggle" title="Regular expression" aria-pressed="false">.*</button>
      <span id="search-count" class="count">0/0</span>
      <button id="search-prev" class="icon-btn" title="Previous (Shift+Enter)" aria-label="Previous"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><use href="#ic-chevron-up"></use></svg></button>
      <button id="search-next" class="icon-btn" title="Next (Enter)" aria-label="Next"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><use href="#ic-chevron-down"></use></svg></button>
      <button id="search-close" class="icon-btn" title="Close (Esc)" aria-label="Close"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><use href="#ic-x"></use></svg></button>
    </div>
    <div id="workspace">
      <aside id="outline" aria-label="Document outline" hidden>
        <div class="outline-title">Outline</div>
        <nav></nav>
      </aside>
      <main id="content" data-font="sans" role="tabpanel" tabindex="0" aria-label="Document"></main>
    </div>
    <div id="banner" hidden></div>
  </body>
</html>
